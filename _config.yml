title: Corte dei Lettori
author:
  name: Gabriel Jones
  email: cortedeilettori@18f.it
description: >
  Benvenuti nella Corte dei lettori, la mia biblioteca personale dove i libri sono al centro di tutto!

minima:
  date_format: "%b %-d, %Y"
  social_links:
    - { icon: "github", title: "Minima Theme repository at GitHub", url: "https://github.com/jekyll/minima" }
    - { icon: "x-twitter", title: "Jekyll profile at X (formerly Twitter)", url: "https://x.com/jekyllrb" }
  show_excerpts: true

# Build settings
baseurl: /opac
remote_theme: gabrielmatteojones/opac
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag

sass:
  quiet_deps: true
  silence_deprecations: [import]

collections:
  books:
    output: true
    permalink: /opac/:title/
